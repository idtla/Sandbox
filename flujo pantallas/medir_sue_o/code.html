<circle class="timer-stroke" cx="100" cy="100" r="90"></circle>

<div class="flex flex-col items-center justify-center z-10">
<span class="text-5xl font-extrabold text-on-surface tracking-tighter" style="font-size: 3.5rem;">05:24</span>

</div>

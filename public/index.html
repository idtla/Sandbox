<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Suenolytics</title>
    <meta
      name="description"
      content="PWA minimalista para registrar el sueño del bebé con una mano."
    />
    <meta name="theme-color" content="#0f1419" />
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top-bar">
        <p class="top-bar__brand" id="appTitle">Suenolytics</p>
        <span id="onlineStatus" class="status-dot" title="Conexión"
          >Comprobando…</span
        >
      </header>

      <main class="views">
        <!-- Vista principal: bienvenida + temporizador + acciones grandes -->
        <section id="viewSleep" class="view view--active" aria-label="Sueño">
          <div id="profileGate" class="gate hidden">
            <p class="gate__text">
              Indica el nombre del bebé y la persona cuidadora en
              <strong>Ajustes</strong> para empezar.
            </p>
          </div>

          <div id="sleepContent" class="sleep-stack">
            <article class="welcome-card" id="welcomeCard">
              <p class="welcome-card__label">Última siesta</p>
              <p id="lastSleepSummary" class="welcome-card__main">
                Sin datos todavía
              </p>
              <p id="lastSleepSub" class="welcome-card__sub muted"></p>
            </article>

            <div class="timer-block">
              <p id="timerPhaseLabel" class="timer-block__phase">Listo</p>
              <p id="timerMetric" class="timer-block__clock" aria-live="polite">
                00:00
              </p>
              <p id="timerHelper" class="timer-block__hint muted"></p>
            </div>

            <div class="action-panel" id="actionPanel">
              <button
                id="startAction"
                type="button"
                class="big-btn big-btn--primary"
              >
                <span
                  class="material-symbols-outlined big-btn__icon"
                  aria-hidden="true"
                  >play_arrow</span
                >
                Empezar a dormir
              </button>
              <button
                id="markAsleepAction"
                type="button"
                class="big-btn big-btn--sleep"
              >
                <span
                  class="material-symbols-outlined big-btn__icon"
                  aria-hidden="true"
                  >bed</span
                >
                Se durmió
              </button>
              <button
                id="markAwakeAction"
                type="button"
                class="big-btn big-btn--wake"
              >
                <span
                  class="material-symbols-outlined big-btn__icon"
                  aria-hidden="true"
                  >wb_sunny</span
                >
                Despertar
              </button>
              <button
                id="cancelAction"
                type="button"
                class="big-btn big-btn--ghost"
              >
                <span
                  class="material-symbols-outlined big-btn__icon"
                  aria-hidden="true"
                  >close</span
                >
                Cancelar intento
              </button>
            </div>

            <details class="method-details">
              <summary>Método</summary>
              <div class="method-row">
                <label class="sr-only" for="quickMethod">Método</label>
                <select id="quickMethod" class="select-minimal">
                  <option value="cuna">Cuna</option>
                  <option value="brazos">Brazos</option>
                  <option value="acunada">Acunada</option>
                </select>
                <button
                  id="updateMethodAction"
                  type="button"
                  class="btn-inline"
                >
                  Guardar
                </button>
              </div>
            </details>
          </div>

          <div id="actionNotice" class="toast-inline hidden"></div>
        </section>

        <!-- Hoy: resumen + lista compacta -->
        <section id="viewToday" class="view" aria-label="Hoy" hidden>
          <article class="stat-row glass-soft">
            <div>
              <p class="stat-row__label">Sueño hoy</p>
              <p id="sleepTodayMetric" class="stat-row__value">0 min</p>
            </div>
            <div>
              <p class="stat-row__label">Latencia media</p>
              <p id="latencyMetric" class="stat-row__value">—</p>
            </div>
          </article>
          <p class="eyebrow-inline">Últimos registros</p>
          <div id="recordsList" class="record-list record-list--compact"></div>
        </section>

        <!-- Ajustes: perfil, manual, instalar -->
        <section id="viewMore" class="view" aria-label="Ajustes" hidden>
          <button
            id="installPwa"
            type="button"
            class="install-chip hidden"
          >
            <span class="material-symbols-outlined" aria-hidden="true"
              >download</span
            >
            Instalar app
          </button>

          <article class="card-minimal">
            <h2 class="card-minimal__title">Perfil</h2>
            <form id="profileForm" class="form-minimal">
              <label class="field-minimal">
                <span>Bebé</span>
                <input
                  id="babyName"
                  name="babyName"
                  type="text"
                  maxlength="60"
                  placeholder="Nombre"
                  required
                />
              </label>
              <label class="field-minimal">
                <span>Cuidador/a</span>
                <input
                  id="caregiverName"
                  name="caregiverName"
                  type="text"
                  maxlength="60"
                  required
                />
              </label>
              <label class="field-minimal">
                <span>Método por defecto</span>
                <select id="defaultMethod" name="defaultMethod">
                  <option value="cuna">Cuna</option>
                  <option value="brazos">Brazos</option>
                  <option value="acunada">Acunada</option>
                </select>
              </label>
              <input id="timeZone" name="timeZone" type="hidden" />
              <div class="form-actions">
                <button type="submit" class="big-btn big-btn--primary">
                  Guardar perfil
                </button>
                <button
                  id="refreshData"
                  type="button"
                  class="big-btn big-btn--ghost"
                >
                  <span
                    class="material-symbols-outlined big-btn__icon"
                    aria-hidden="true"
                    >refresh</span
                  >
                  Sincronizar
                </button>
              </div>
              <div id="profileNotice" class="toast-inline hidden"></div>
            </form>
          </article>

          <article class="card-minimal">
            <h2 class="card-minimal__title">Registro manual</h2>
            <form id="manualForm" class="form-minimal">
              <div class="time-grid">
                <label class="field-minimal">
                  <span>Intento</span>
                  <input id="manualIntent" type="time" required />
                </label>
                <label class="field-minimal">
                  <span>Sueño</span>
                  <input id="manualSleep" type="time" required />
                </label>
                <label class="field-minimal">
                  <span>Despertar</span>
                  <input id="manualWake" type="time" required />
                </label>
                <label class="field-minimal">
                  <span>Método</span>
                  <select id="manualMethod">
                    <option value="cuna">Cuna</option>
                    <option value="brazos">Brazos</option>
                    <option value="acunada">Acunada</option>
                  </select>
                </label>
              </div>
              <div class="form-actions">
                <button type="submit" class="big-btn big-btn--primary">
                  Guardar
                </button>
                <button
                  id="resetManualForm"
                  type="button"
                  class="big-btn big-btn--ghost"
                >
                  Limpiar
                </button>
              </div>
              <div id="manualNotice" class="toast-inline hidden"></div>
            </form>
          </article>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Principal">
        <button
          type="button"
          class="bottom-nav__item is-active"
          data-view="sleep"
          aria-current="page"
        >
          <span class="bottom-nav__icon-wrap" aria-hidden="true">
            <span class="material-symbols-outlined bottom-nav__icon"
              >dark_mode</span
            >
            <span class="bottom-nav__zz" aria-hidden="true">z</span>
            <span class="bottom-nav__zz bottom-nav__zz--2" aria-hidden="true">z</span>
          </span>
          <span class="bottom-nav__label">Sueño</span>
        </button>
        <button type="button" class="bottom-nav__item" data-view="today">
          <span
            class="material-symbols-outlined bottom-nav__icon"
            aria-hidden="true"
            >calendar_today</span
          >
          <span class="bottom-nav__label">Hoy</span>
        </button>
        <button type="button" class="bottom-nav__item" data-view="more">
          <span
            class="material-symbols-outlined bottom-nav__icon"
            aria-hidden="true"
            >settings</span
          >
          <span class="bottom-nav__label">Ajustes</span>
        </button>
      </nav>
    </div>

    <!-- Elementos legacy / métricas para compatibilidad con app.js (ocultos) -->
    <span id="stateMetric" hidden></span>
    <span id="stateHelper" hidden></span>

    <script type="module" src="/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project Timer · Config</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="wrap simple-wrap">
    <div class="nav-tabs">
      <a class="tab" href="./index.html">Timer</a>
      <a class="tab active" href="./config.html">Config</a>
      <a class="tab" href="./charts.html">Charts</a>
    </div>

    <div class="card one-col">
      <div class="panel">
        <h2>Configuración de proyectos</h2>
        <p class="helper">Aquí puedes crear proyectos y elegir sus colores. El color A/B se usa para el fondo.</p>

        <form id="projectForm" class="form-grid">
          <input id="projectName" type="text" placeholder="Nombre del proyecto" required />
          <label>Color A <input id="colorA" type="color" value="#4bbcee" /></label>
          <label>Color B <input id="colorB" type="color" value="#0d3b4a" /></label>
          <button type="submit" class="btn-primary">Añadir proyecto</button>
        </form>

        <div id="projectList" class="list"></div>

        <hr class="sep" />

        <h2>Datos JSON</h2>
        <div class="btnrow start">
          <button id="syncBtn" type="button">Sincronizar ahora</button>
          <button id="downloadBtn" type="button" class="btn-primary">Descargar JSON</button>
          <label class="file-upload">Cargar JSON
            <input id="uploadJson" type="file" accept="application/json" />
          </label>
        </div>

        <p class="helper" id="syncInfo">Última sincronización: Nunca</p>
      </div>
    </div>
  </div>

  <script src="./js/data.js"></script>
  <script src="./js/config.js"></script>
</body>
</html>
